services:
  # VNC Server (Ubuntu)
  remote-desktop:
    image: ${IMAGE_PREFIX:-nishanb}/ck-x-simulator-remote-desktop:latest
    build:
      context: ./remote-desktop
    hostname: terminal
    shm_size: 512m # Electron and Firefox share memory through /dev/shm
    expose:
      - "5901" # VNC port (internal only)
      - "6901" # Web VNC port (internal only)
    environment:
      - VNC_PW=bakku-the-wizard
      - VNC_PASSWORD=bakku-the-wizard
      - VNC_VIEW_ONLY=false
      - VNC_RESOLUTION=1280x800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6901/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G # VSCodium (Electron) needs the extra headroom
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - ckx-network

  # Web Application (not directly exposed to users)
  webapp:
    image: ${IMAGE_PREFIX:-nishanb}/ck-x-simulator-webapp:latest
    build:
      context: ./app
    expose:
      - "3000" # Only exposed to internal network
    environment:
      - VNC_SERVICE_HOST=remote-desktop
      - VNC_SERVICE_PORT=6901
      - VNC_PASSWORD=bakku-the-wizard
      - SSH_HOST=remote-terminal
      - SSH_PORT=22
      - SSH_USER=candidate
      - SSH_PASSWORD=password
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network

  # Nginx Reverse Proxy - ONLY SERVICE EXPOSED TO USERS
  nginx:
    image: ${IMAGE_PREFIX:-nishanb}/ck-x-simulator-nginx:latest
    build:
      context: ./nginx
    depends_on:
      - webapp
      - remote-desktop
      - remote-terminal
      - facilitator
      - k8s-api-server
    ports:
      - "30080:80" # Expose Nginx on port 30080
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network

  # Jump Host (ckad9999 and ckad9988)
  jumphost:
    image: ${IMAGE_PREFIX:-nishanb}/ck-x-simulator-jumphost:latest
    build:
      context: ./jumphost
    hostname: ckad9999
    privileged: true
    # No external port mappings - only accessible internally
    expose:
      - "22" # SSH port (internal only)
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
    depends_on:
      external-kubeconfig: # only active with the "external-cluster" profile
        condition: service_completed_successfully
        required: false
    deploy:
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Remote Terminal Service
  remote-terminal:
    image: ${IMAGE_PREFIX:-nishanb}/ck-x-simulator-remote-terminal:latest
    build:
      context: ./remote-terminal
    hostname: remote-terminal
    expose:
      - "22" # SSH port (internal only)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # KIND Kubernetes Cluster
  k8s-api-server: # Service name that will be used for DNS resolution
    image: ${IMAGE_PREFIX:-nishanb}/ck-x-simulator-cluster:latest
    build:
      context: ./kind-cluster
    container_name: kind-cluster
    hostname: k8s-api-server
    privileged: true # Required for running containers inside KIND
    expose:
      - "6443"
      - "22"
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "ls", "/ready"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 60s

  # External cluster (optional, profile "external-cluster")
  # Installs a user-provided kubeconfig (and optionally an SSH directory) into the
  # shared kube-config volume and flags it, so the jumphost scripts use that
  # cluster instead of creating a k3d one. Usage:
  #   kubectl config view --flatten --minify --kubeconfig <file> > /path/to/flat-kubeconfig
  #   EXTERNAL_KUBECONFIG=/path/to/flat-kubeconfig \
  #   EXTERNAL_SSH_DIR=/path/to/ssh-dir \
  #   docker compose --profile external-cluster up -d --build
  # EXTERNAL_SSH_DIR is optional; it holds an ssh "config" (host aliases such as
  # node01/node02/k8s-api-server, logging in as root) and the pre-authorized keys.
  # To go back to k3d: docker compose down --volumes (removes the flag).
  external-kubeconfig:
    profiles: ["external-cluster"]
    image: alpine:3.20
    restart: "no"
    volumes:
      - kube-config:/home/candidate/.kube
      - ${EXTERNAL_KUBECONFIG:-/dev/null}:/external/kubeconfig:ro
      - ${EXTERNAL_SSH_DIR:-/dev/null}:/external/ssh:ro
    command:
      - sh
      - -c
      - |
        if [ ! -s /external/kubeconfig ]; then
          echo "EXTERNAL_KUBECONFIG must point to a non-empty, flattened kubeconfig file" >&2
          exit 1
        fi
        cp /external/kubeconfig /home/candidate/.kube/kubeconfig
        chmod 644 /home/candidate/.kube/kubeconfig
        rm -rf /home/candidate/.kube/.ssh-external
        if [ -d /external/ssh ]; then
          mkdir -p /home/candidate/.kube/.ssh-external
          cp -R /external/ssh/. /home/candidate/.kube/.ssh-external/
          echo "External SSH directory installed"
        else
          echo "EXTERNAL_SSH_DIR not set: nodes will not be reachable over SSH" >&2
        fi
        touch /home/candidate/.kube/.external-cluster
        echo "External kubeconfig installed"
    networks:
      - ckx-network

  # Redis Database for Facilitator
  redis:
    image: redis:alpine
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Facilitator Service
  facilitator:
    image: ${IMAGE_PREFIX:-nishanb}/ck-x-simulator-facilitator:latest
    build:
      context: ./facilitator
      dockerfile: Dockerfile
    hostname: facilitator
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=prod
      - SSH_HOST=jumphost
      - SSH_PORT=22
      - SSH_USERNAME=candidate
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRACK_METRICS=true # based on the environment variable TRACK_METRICS, the facilitator will send metrics to the metric server
    restart: unless-stopped
    depends_on:
      - jumphost
      - redis
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ckx-network:
    name: ckx-network
    driver: bridge

volumes:
  kube-config: # Shared volume for Kubernetes configuration
